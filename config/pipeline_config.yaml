# Logging Configuration
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR)
  level: "INFO"
  
  # Log file path (null = no file logging)
  log_file: "./azure_video_processor.log"
  cleanup_temp_dir: true                      # Remove temporary download director
