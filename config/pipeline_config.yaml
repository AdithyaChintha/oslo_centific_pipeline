# Pipeline Configuration for Ray Video Processing Pipeline
# This file configures the batch processing, polling, and storage settings

# Azure Blob Storage Configuration
azure_storage:
  # Input directory configuration
  input_blob_prefix: "one-data-platform/"  # Default blob prefix to search for videos
  # Output directory configuration
  output_blob_prefix: "one_data_platform_output/"  # Base prefix for uploading processed results
  
  # Container settings (these can override blobfuse2_config.yaml if needed)
  # container_name: "instavideo"  # Uncomment to override
  # account_name: ""              # Uncomment to override
  # account_key: ""               # Uncomment to override

# Local Directory Configuration
local_storage:
  # Local file system configuration
  temp_download_dir: "/tmp/azure_downloads"   # Temporary download location
  output_base_dir: "./output_test_51"                    # Local output directory
  video_list_file: "./azure_video_list.json"  # Video discovery tracking
  checklist_file: "./video_checklist.json"    # Processing progress tracking

polling:
  # Continuous polling configuration
  interval_minutes: 5                         # Check for new videos every 5 minutes

processing:
  # Batch processing configuration
  max_videos_per_batch: 1            # Process 5 videos per batch
  # This creates parallel Ray tasks for downloading:
  # - Batch 1: 5 videos → 5 parallel Ray tasks (one per video)
  # - Each Ray task runs on a separate CPU core
  # - True parallel downloading for maximum speed
  
  # Audio file extensions to search for
  audio_extensions: ['.wav', '.WAV', '.mp3', '.aac', '.m4a']

cleanup:
  # Whether to clean up temporary download directory after processing
  cleanup_temp_dir: true
  
  # Whether to clean up session output directory after successful upload to blob
  cleanup_output_dir: true
  
  # Whether to clean up individual files after each video processing
  cleanup_files_after_each_video: true
  
  # Retention time for video list file (in days, null = never clean)
  video_list_retention_days: 30

# Label Studio Configuration
label_studio:
  # Label Studio server URL
  server_url: "https://annotations-stg.oneforma2.com/"
  
  # API token for Label Studio
  api_token: "d75a31c7994b96099cfbf7d61e15cff643943853"
  
  # Project ID
  project_id: "5684"
