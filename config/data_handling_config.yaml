# config.yaml

azure_source:
  # Azure Storage connection string for the source container (or set as env and leave blank here)
  connection_string: "DefaultEndpointsProtocol=https;AccountName=oslotestvideo;AccountKey=zOevIegkZjld6ciTY+alA+YkzZ2gdAWVP7rkuhty5NAZ67AtiBB3fRTaa+eE3UbqhgwHZvWkOM0L+ASt4zCx6g==;EndpointSuffix=core.windows.net"   # env var name containing source connection string
  container_name: "instavideo"                  # source container name
  source_prefix: "multi_chunk/raw_insv/" 
  # Not required for the new flow, leave empty unless you still use it
  container_sas: ""
  container_sas_env: ""

openai:
  # Option A (recommended): point to an env var that contains the key
  api_key: "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"                    # leave empty, use api_key_env instead
  api_key_env: "OPENAI_API_KEY"  # env var name that stores your key

  # Container creation / upload / responses endpoints (defaults are suitable for most accounts)
  containers_api: "https://api.openai.com/v1/containers"
  # Upload endpoint: set to the variant your org uses if you know it.
  # Default in the script is container_files (underscore). If your org uses hyphen, change this:
  container_files_api: "https://api.openai.com/v1/container_files"
  # Alternative (if needed): "https://api.openai.com/v1/container-files"
  submissions_api: "https://api.openai.com/v1/responses"

  # Purpose used when creating containers
  purpose: "ingestion"

  # Default model (used when posting a Responses run)
  model: "gpt-4o-mini"

deduplication:
  safety_window_minutes: 2

local_paths:
  manifests_dir: "./local_manifests"
  watermark_file: "./local_manifests/watermark.json"
  work_dir: "./work"

submission:
  auto_submit: true
  retry_attempts: 3
  retry_delay_seconds: 60
  # Default model & prompt (overrides openai.model if set here)
  model: "gpt-4o-mini"
  prompt: "Process files in this container and return a concise JSON summary."
  # Optional: extra fields to include in Responses body (e.g., top_p, temperature, tool config)
  responses_extra_body: {}

remote_manifests:
  enabled: true                    # set to true to upload manifests to an azure container
  connection_string: "DefaultEndpointsProtocol=https;AccountName=oslotestvideo;AccountKey=zOevIegkZjld6ciTY+alA+YkzZ2gdAWVP7rkuhty5NAZ67AtiBB3fRTaa+eE3UbqhgwHZvWkOM0L+ASt4zCx6g==;EndpointSuffix=core.windows.net"   # env var name for Azure storage conn for manifests container
  container_name: "submission-summary"         # container where manifests will be stored
  prefix: None 
