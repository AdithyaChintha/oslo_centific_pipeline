openai:
  # Provide either api_key here OR set env var name to look up
  # api_key: "sk-..."
  api_key: ${OPENAI_API_KEY}
  containers_api: "https://api.openai.com/v1/training_data/containers"
  submissions_api: "https://api.openai.com/v1/training_data/submissions"
  purpose: "ingestion"

azure_source:
  connection_string: "DefaultEndpointsProtocol=https;AccountName=oslotestvideo;AccountKey=zOevIegkZjld6ciTY+alA+YkzZ2gdAWVP7rkuhty5NAZ67AtiBB3fRTaa+eE3UbqhgwHZvWkOM0L+ASt4zCx6g==;EndpointSuffix=core.windows.net"   # env var name containing source connection string
  container_name: "instavideo"                  # source container name
  source_prefix: "multi_chunk"
  home_id: "raw_"                 # optional prefix to limit processed blobs
  # Optional source container SAS (for azcopy mode). Provide env var name or literal (not recommended)
  container_sas_env: ""        # optional: env var name that holds source container SAS URL
  # container_sas: "https://...<sas>"          # optional: avoid storing SAS in file for security

azure_partner:
  use_azcopy: true
  azcopy_path: "/usr/bin/azcopy"  # adjust for your OS/Install

deduplication:
  safety_window_minutes: 2   # ignore blobs newer than now - N minutes

local_paths:
  manifests_dir: "./local_manifests"            # local fallback for manifests (must exist or created)
  watermark_file: "./local_manifests/watermark.json"
  work_dir: "./work"

submission:
  auto_submit: true
  retry_attempts: 3
  retry_delay_seconds: 60

# NEW: remote manifests container settings (optional)
remote_manifests:
  enabled: true                    # set to true to upload manifests to an azure container
  connection_string: "DefaultEndpointsProtocol=https;AccountName=oslotestvideo;AccountKey=zOevIegkZjld6ciTY+alA+YkzZ2gdAWVP7rkuhty5NAZ67AtiBB3fRTaa+eE3UbqhgwHZvWkOM0L+ASt4zCx6g==;EndpointSuffix=core.windows.net"   # env var name for Azure storage conn for manifests container
  container_name: "submission-summary"         # container where manifests will be stored
  prefix: ""          # optional blob path prefix inside manifests container

logging:
  level: INFO               # DEBUG|INFO|WARNING|ERROR
  file: "./logs/data_pusher.log"
  max_mb: 10                # rotate at ~10 MB
  backup_count: 5           # keep 5 old files




renaming:
  enabled: true
  mapping_file: "/home/nvcoe_admin/adithya/adithya2/insta360-video-activity-segmentation/data_handling_to_client/new_blob_names.ods"
  sheet_name:  "Sheet1"
  old_column: "old blob name"
  new_column: "new blob name"
  match_mode: "auto"
