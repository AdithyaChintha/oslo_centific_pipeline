# TAR Inspection Configuration File
# This config is used for random TAR sampling, extraction, Azure Blob upload, and CSV reporting

# =============================================================================
# INPUT SOURCE CONFIGURATION
# =============================================================================
# Select the input source for TAR files: 'sharepoint' or 'blob'
# - sharepoint: Fetch TAR files from SharePoint (requires azure_ad and sharepoint config)
# - blob: Fetch TAR files from Azure Blob Storage (requires azure_source config)
input_source: "sharepoint"  # Options: "sharepoint" | "blob"

# =============================================================================
# AZURE BLOB SOURCE (only required when input_source: "blob")
# =============================================================================
# Configuration for reading TAR files from Azure Blob Storage
azure_source:
  connection_string: "DefaultEndpointsProtocol=https;AccountName=oslotestvideo;AccountKey=zOevIegkZjld6ciTY+alA+YkzZ2gdAWVP7rkuhty5NAZ67AtiBB3fRTaa+eE3UbqhgwHZvWkOM0L+ASt4zCx6g==;EndpointSuffix=core.windows.net"
  container_name: "instavideo"
  source_prefix: "hydra_plus_tar_files/"
  project_id: "oslo_project_2"

# =============================================================================
# SHAREPOINT CONFIGURATION (only required when input_source: "sharepoint")
# =============================================================================
# Azure AD App Registration Credentials (reused from tar_transfer_config.yaml)
azure_ad:
  tenant_id: "9b415834-803a-4da0-afdc-fe6b1d52d649"
  client_id: "cf36a429-766a-47eb-9b49-66b04a227ead"
  client_secret: "jnf8Q~3H41HHHfLvwBh0seXNvos80e5~GhMhLapI"

# SharePoint Site Configuration (reused from tar_transfer_config.yaml)
sharepoint:
  site_url: "https://digitaltechedge.sharepoint.com/sites/Oslo Humus Moderators"
  site_id: "digitaltechedge.sharepoint.com,38fe5936-7c38-45ec-9bd5-b0051fed3610,65326b1d-1ff4-4a70-a464-f1d3a39186aa"

  # TAR source folder (same as transfer config)
  tar_source_folder_path: "/Uploads/NJ(Pilot)"

  drive_id: "b!Nln-ODh87EWb1bAFH-02EB1rMmX0H3BKpGTx06ORhqpuRZrKdUe9RrHjIH-Pdeog"

# Azure Blob Storage Configuration (reused from tar_transfer_config.yaml)
azure_blob:
  connection_string: "DefaultEndpointsProtocol=https;AccountName=oslotestvideo;AccountKey=zOevIegkZjld6ciTY+alA+YkzZ2gdAWVP7rkuhty5NAZ67AtiBB3fRTaa+eE3UbqhgwHZvWkOM0L+ASt4zCx6g==;EndpointSuffix=core.windows.net"

  # Container name (same storage account, same container)
  container_name: "instavideo"

# Inspection-Specific Settings
inspection:
  # =============================================================================
  # EXECUTION MODE
  # =============================================================================
  # Execution mode: 'random', 'list', or 'csv'
  # - random: Randomly sample TAR files from source (uses sampling_ratio)
  # - list: Process specific TAR files (uses tar_file_list)
  # - csv: Randomly sample TAR files from comparison CSV (uses csv_input_file & csv_sample_count)
  execution_mode: "list"  # Options: "random" | "list" | "csv"

  # Target blob prefix for extracted/untarred files
  # Extracted files will be uploaded to: instavideo/untar_folder_oslo2/<tar_name>/<file_path>
  untar_blob_prefix: "untar_folder_oslo2/testing_erp/downsclaeit"

  # =============================================================================
  # RANDOM MODE SETTINGS
  # =============================================================================
  # Sampling ratio: Pick 1 random TAR file per every N files
  # Example: 10 means pick 1 file from every 10 TAR files
  sampling_ratio: 5

  # =============================================================================
  # LIST MODE SETTINGS
  # =============================================================================
  # List of specific TAR filenames to process (only used when execution_mode: "list")
  # Filenames should match exactly as they appear in source
  tar_file_list:
    - "cdd36c49-29e0-43fb-a7d9-9647c86e4d77.tar"


  # =============================================================================
  # CSV MODE SETTINGS (for orchestrator integration)
  # =============================================================================
  # Path to comparison CSV file (output from tar_state_file_comparison.py)
  # Only TAR files with mapping_status='FOUND' and state_status='success' will be considered
  csv_input_file: ""

  # Number of random TAR files to pick from the CSV for inspection
  csv_sample_count: 4

  # =============================================================================
  # RAY PARALLEL PROCESSING SETTINGS
  # =============================================================================
  # Ray is used for parallel video processing (ERP conversion + downscaling)
  # WARNING: Ray can cause VM hangs/zombie processes if GCS fails to initialize
  # Recommend keeping disabled for stability
  ray:
    enabled: false  # Disabled by default for stability
    max_parallel: 2  # Number of parallel video processing tasks
    use_gpu: false

  # =============================================================================
  # VIDEO PROCESSING SETTINGS
  # =============================================================================
  # Enable video downscaling (reduces file size for preview)
  enable_video_downscaling: true

  # Target height for downscaled videos (480 = 480p)
  downscale_target_height: 480

  # Downscale quality: 'fast', 'medium', or 'slow' (affects encoding speed vs quality)
  downscale_quality: "medium"

  # =============================================================================
  # OTHER SETTINGS
  # =============================================================================
  # SAS token expiry in days (default: 30 days for team inspection)
  sas_token_expiry_days: 365

  # Local temporary directory for extracting TAR files
  temp_extract_dir: "/data/oslo/tar_extractions"

  # Directory where CSV inspection reports will be saved
  csv_report_dir: "/data/oslo/untar_inspection_reports_"

  # State file to track already-inspected TAR files (avoids re-inspection)
  inspection_state_file: "/data/oslo/tar_temp_downloads/tar_inspection_state.json"

# Local Paths (reused from tar_transfer_config.yaml)
local_paths:
  # Temporary directory for downloading TAR files from SharePoint
  temp_download_dir: "/data/oslo/tar_temp_downloads_inspection"

  # Transfer state file (used by sharepoint_tar_to_azure_blob.py, not by inspector)
  transfer_state_file: "/data/oslo/tar_temp_downloads/tar_transfer_state.json"

# API Configuration (reused from tar_transfer_config.yaml)
api:
  timeout_seconds: 300
  retry_attempts: 3
  retry_delay_seconds: 5
