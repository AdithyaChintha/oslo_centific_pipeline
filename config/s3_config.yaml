s3:
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  region: "us-west-2"
  bucket_name: "troveo-videodb-shared"
  input_prefix: "outputs/batch_1"
  output_prefix: "results/"
  presigned_url_expiry_days: 365
  source_video_prefix: "transcoding_profile_id=5"
  movement_metadata:
    enabled: true  # Set to false to disable movement metadata lookup
    s3_key: "outputs/batch_1/batch_1_metadata_samples.parquet"  # Path to parquet file in S3
    cache_locally: true  # Whether to cache downloaded parquet file


state_tracking:
  enabled: true
  state_file: "s3_state.json"
  max_retry_attempts: 3

polling:
  enabled: true
  interval_minutes: 5
  max_videos_per_cycle: 1

processing:
  temp_dir: "./temp_downloads"
  output_dir: "./output"
  cleanup_after_processing: true

labelstudio:
  api_url: "https://annotations-stg.oneforma2.com/api/projects/"
  api_key: "1af6610f3fa81575f5215067c8455a26682b92ae"
  project_id: 6001
  auto_create_tasks: true