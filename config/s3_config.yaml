input_file: "video_lists_batch_2/server_2_videos.txt"
s3:
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  region: "us-west-2"
  bucket_name: "troveo-videodb-shared"
  input_prefix: "outputs/batch_2_tier_1"
  output_prefix: "results/"
  presigned_url_expiry_days: 365
  source_video_prefix: "transcoding_profile_id=5"
  movement_metadata:
    enabled: true  # Set to false to disable movement metadata lookup
    s3_key: "outputs/batch_2_tier_1/batch_2_tier_1_metadata.parquet"  # Path to parquet file in S3
    cache_locally: false  # Whether to cache downloaded parquet file


state_tracking:
  enabled: true
  state_file: "s3_state_prod_batch_2_server2.json"
  max_retry_attempts: 3
  process_failed_videos_again: false

polling:
  enabled: true
  interval_minutes: 5
  max_videos_per_cycle: 5

processing:
  temp_dir: "/data/pyrenees_testing/pyrenees_downloads"
  output_dir: "/data/pyrenees_output_testing/batch2/server1"
  cleanup_after_processing: true

labelstudio:
  auto_create_tasks: true
  export_mode: "csv"  # Options: "api", "csv", "both"
  csv_export:
    enabled: true
    local_output_dir: "./csv_files/batch_2/labelstudio_csv_prod_server_2"
    azure_upload: true
    azure_blob_prefix: "batch_2/csv_files_prod_server_2/"
    filename_format: "labelstudio_tasks_server_2_cycle_{cycle}_{timestamp}.csv"
    per_cycle_file: true  # One CSV file per polling cycle
  # Primary Label Studio project
  primary:
  
    api_url: "http://20.55.226.129:8082/api/projects/"
    api_key: "f33c1e1ea29e6a3891b705c263b488e469cfe0ed"
    project_id: 1

  # Secondary Label Studio project (optional - set enabled: false to disable)
  secondary:
    enabled: true
    api_url: "http://20.55.226.129:8081/api/projects/"
    api_key: "85367c27739d01803fa94da1f450b1c50a655615"
    project_id: 1

