input_file: "video_lists_batch_8/server_1_videos.txt"
s3:
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  region: "us-west-2"
  bucket_name: "troveo-videodb-shared"
  input_prefix: "outputs/batch_6.1_tier_1"
  output_prefix: "results/"
  presigned_url_expiry_days: 365
  source_video_prefix: "transcoding_profile_id=5"
  movement_metadata:
    enabled: true  # Set to false to disable movement metadata lookup
    s3_key: "outputs/batch_8.1_tier_1/batch_8.1_tier_1_metadata.parquet"  # Path to parquet file in S3
    cache_locally: false  # Whether to cache downloaded parquet file


state_tracking:
  enabled: true
  state_file: "s3_state_prod_batch_7_server2_pushing_to_label_studio.json"
  max_retry_attempts: 3

polling:
  enabled: true
  interval_minutes: 5
  max_videos_per_cycle: 15

processing:
  temp_dir: "/data/pyrenees/pyrenees_downloads"
  output_dir: "/data/pyrenees_output/batch7/server1"
  cleanup_after_processing: true

labelstudio:
  auto_create_tasks: true
  export_mode: "api"  # Options: "api", "csv", "both"
  csv_export:
    enabled: true
    local_output_dir: "./csv_files/batch_8/labelstudio_csv_prod_server_1"
    azure_upload: true
    azure_blob_prefix: "batch_8/csv_files_prod_server_1/"
    filename_format: "labelstudio_tasks_server_2_cycle_{cycle}_{timestamp}.csv"
    per_cycle_file: true  # One CSV file per polling cycle
  # Primary Label Studio project
  primary:
  
    api_url: "https://annotation.centific.com/api/projects/"
    api_key: "7878dbd7204982e6f2875094d660df3786b33297"
    project_id: 4

  # Secondary Label Studio project (optional - set enabled: false to disable)
  secondary:
    enabled: true
    api_url: "https://annotation.centific.com/api/projects/"
    api_key: "7878dbd7204982e6f2875094d660df3786b33297"
    project_id: 5

