# =============================================================================
# API CONFIGURATION
# =============================================================================
api:
  timeout_seconds: 300
  retry_attempts: 3
  retry_delay_seconds: 5

# =============================================================================
# POLLING CONFIGURATION - Monitor for new JSON metadata files
# =============================================================================
# When enabled, the pipeline will poll for new JSON metadata files after
# initial processing. This allows TAR files without JSON to be uploaded
# later when their JSON files become available.
#
# Example scenario:
#   - Pipeline starts at 6:30 AM, finds 100 TAR files but only 80 have JSON
#   - 80 TAR files are uploaded immediately
#   - Pipeline polls every 5 minutes for the remaining 20 JSON files
#   - At 7:15 AM, 15 new JSON files are detected and their TAR files uploaded
#   - After max cycles (or all processed), final reports are generated
#
polling:
  enabled: true                     # Enable/disable polling mechanism

  # Polling interval: time between each polling cycle
  interval_minutes: 5               # Check for new JSONs every 5 minutes

  # Maximum polling cycles: how many times to poll before generating final reports
  # Total polling duration = interval_minutes * max_cycles
  # Example: 5 min * 12 cycles = 60 minutes (1 hour) of polling
  max_cycles: 12

  # Early exit: stop polling early if all pending files are processed
  exit_when_all_processed: true

  # State file for resume capability
  # If pipeline is interrupted, it can resume from this state file
  state_file: "/data/oslo/polling_state/tar_polling_state.json"

  # Retry settings for blob connectivity issues during polling
  retry_on_error: true
  max_retries_per_cycle: 3
  retry_delay_seconds: 10
