  max_mb: 10
  backup_count: 5

# =============================================================================
# STATE STORAGE - Azure Blob storage for upload state
# =============================================================================
state_storage:
  enabled: true
  connection_string: "DefaultEndpointsProtocol=https;AccountName=oslotestvideo;AccountKey=zOevIegkZjld6ciTY+alA+YkzZ2gdAWVP7rkuhty5NAZ67AtiBB3fRTaa+eE3UbqhgwHZvWkOM0L+ASt4zCx6g==;EndpointSuffix=core.windows.net"
  container_name: "instavideo"
  prefix: "upload_state_files/production_dec1/tar_statefile_nov30"

# =============================================================================
# STATE TRACKING - Local state tracking
# =============================================================================
state_tracking:
  enabled: true
  local_dir: "/data/oslo/upload_state/tar_inspectiondec1"
  backup_enabled: true
  max_daily_entries: 365
  compression_enabled: true

# =============================================================================
# TAR UPLOAD SETTINGS
# =============================================================================
tar_upload:
  require_metadata: false              # Don't require metadata for tar files
  require_metadata_json: true          # Require corresponding JSON file for each tar file
                                       # e.g., test-1gb.tar requires test-1gb.json
                                       # Tar files without matching JSON will be skipped
  file_extension: ".tar"

# =============================================================================
# INSPECTION SETTINGS (Step 5 - TAR Inspection)
# =============================================================================
# Input source for inspection: 'sharepoint' or 'blob'
# - sharepoint: Fetch TAR files from SharePoint
# - blob: Fetch TAR files from Azure Blob Storage (uses azure_source above)
input_source: "blob"  # Options: "sharepoint" | "blob"

inspection:
  # Execution mode: 'random', 'list', or 'csv'
  # - random: Randomly sample TAR files from source (uses sampling_ratio)
  # - list: Process specific TAR files (uses tar_file_list)
  # - csv: Randomly sample TAR files from comparison CSV (uses csv_input_file & csv_sample_count)
  execution_mode: "random"  # Options: "random" | "list" | "csv"

  # Target blob prefix for extracted/untarred files
  # Extracted files will be uploaded to: instavideo/<untar_blob_prefix>/<tar_name>/<file_path>
  untar_blob_prefix: "untar_folder_oslo2/produciton_dec/dec_inspection"

  # --- RANDOM MODE SETTINGS ---
  sampling_ratio: 10  # Pick 1 random TAR file per every N files

  # --- LIST MODE SETTINGS ---
  tar_file_list:
    - "7c8ec110-695c-4f91-8d24-3f6fab971233.tar"
    - "d21cd805-4ae8-48cf-80d5-70749868ee2b.tar"
    - "32a2aa25-8a2a-43f4-ab01-184f046f3281.tar"

  # --- CSV MODE SETTINGS (for orchestrator integration) ---
  # Path to comparison CSV file (auto-populated by orchestrator)
  csv_input_file: ""
  # Number of random TAR files to pick from the CSV for inspection
  csv_sample_count: 2

  # --- OTHER SETTINGS ---
  sas_token_expiry_days: 365
  temp_extract_dir: "/data/oslo/tar_extractions"
  csv_report_dir: "/data/oslo/inspection_reports/tar"
  inspection_state_file: "/data/oslo/tar_temp_downloads/tar_inspection_production.json"

  # Video downscaling settings
  enable_video_downscaling: true
  downscale_target_height: 480
  downscale_quality: "medium"

  # --- RAY PARALLEL PROCESSING SETTINGS ---
  # Enable Ray for parallel video processing (fisheye-to-ERP, downscaling)
  # WARNING: Ray can cause VM hangs/zombie processes if GCS fails to initialize
  # Recommend keeping disabled unless you need parallel processing speed
  ray:
    enabled: false                 # Disabled by default for stability (set to true if needed)
    max_parallel: 2                # Number of parallel video processing tasks
    use_gpu: false                 # Set to true if GPU (CUDA) is available for ffmpeg

